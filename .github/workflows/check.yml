name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Biome + TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Run checks
        run: npm run check
